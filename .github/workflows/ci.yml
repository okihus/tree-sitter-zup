name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly tripwire: catches zup syntax landing upstream that the
    # grammar doesn't parse yet.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Generated parsers are in sync with grammar.js
        run: |
          nix shell nixpkgs#tree-sitter nixpkgs#nodejs -c tree-sitter generate
          nix shell nixpkgs#tree-sitter nixpkgs#nodejs -c bash -c 'cd zupt && tree-sitter generate'
          git diff --exit-code -- src/ zupt/src/

      - name: Corpus tests (zup)
        run: nix shell nixpkgs#tree-sitter nixpkgs#nodejs nixpkgs#gcc -c tree-sitter test

      - name: Corpus tests (zupt)
        run: nix shell nixpkgs#tree-sitter nixpkgs#nodejs nixpkgs#gcc -c bash -c 'cd zupt && tree-sitter test'

      - name: Flake packages build
        run: nix build .#tree-sitter-zup .#tree-sitter-zupt .#tree-sitter-zup-queries

  zup-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: hent0/zup
          path: zup-upstream

      - uses: cachix/install-nix-action@v31

      - name: Record upstream commit
        run: git -C zup-upstream log -1 --oneline

      # Parses examples/, std/, the .zupt section structure, and — unlike a bare
      # `tree-sitter parse`, which cannot resolve injections — the zup inside
      # each --FILE-- body. Fails on any ERROR or MISSING node.
      - name: Parse zup corpus (fails on any ERROR node)
        run: |
          nix shell nixpkgs#tree-sitter nixpkgs#nodejs nixpkgs#gcc -c \
            ./scripts/check-zup-corpus.sh zup-upstream
